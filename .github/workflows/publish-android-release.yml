name: Build and publish Android release
run-name: Build Android release for ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to attach to the APK release.
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: main
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Restore the Android signing key
        run: |
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub Actions secret: ${variable}" >&2
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"

      - name: Set the app version from the release tag
        run: node scripts/prepare-release-version.js "$RELEASE_TAG"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the signed release APK
        working-directory: android
        run: ./gradlew app:assembleRelease --build-cache -I ../scripts/release-signing.gradle

      - name: Prepare APK
        id: apk
        run: |
          apk_name="Memento-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          echo "path=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Store build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memento-${{ inputs.release_tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
